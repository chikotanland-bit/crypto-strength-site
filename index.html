<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市場の相対強度</title>
<style>
body{margin:0;background:#f7f6f0;color:#27372e;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header,main{max-width:1000px;margin:auto;padding:18px}
h1{font-size:34px}em{color:#547b61;font-style:normal}
.panel{background:#fffefa;border:1px solid #e6e5dc;border-radius:16px;padding:16px;margin:14px 0}
button,select{padding:9px;border:1px solid #ddd;border-radius:8px;background:white;margin:3px}
button.active{background:#547b61;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}
.coin{padding:12px;border:1px solid #e6e5dc;border-radius:10px}
.price{font-size:17px;font-weight:bold;margin-top:8px}
small,.muted{color:#78857b}
canvas{width:100%;height:260px}
</style>
</head>
<body>
<header><b>強　市場の相対強度</b></header>
<main>
<p>MARKET COMPARISON / 20 CRYPTO ASSETS</p>
<h1>どの資産が、<br><em>相対的に強い？</em></h1>
<p>期間の最初を100として値動きを比較します。</p>
<section class="panel">
<h2>期間別・相対パフォーマンス</h2>
<div id="periods"></div>
<canvas id="chart"></canvas>
<p id="status">価格データを取得中…</p>
<div id="legend"></div>
</section>
<section class="panel">
<h2>暗号資産20銘柄</h2>
<button id="refresh">価格を更新</button>
<div class="grid" id="coins"></div>
<p id="priceStatus"></p>
</section>
<section class="panel">
<h2>株価指数・ゴールド</h2>
<p>S&P 500、NASDAQ、NYダウ、日経平均、ゴールド：実データ未接続</p>
</section>
<small>データ提供元：CoinGecko 公開API。取得制限により表示できない場合があります。</small>
</main>
<script>
const assets=[['bitcoin','BTC','ビットコイン'],['ethereum','ETH','イーサリアム'],['tether','USDT','テザー'],['ripple','XRP','XRP'],['binancecoin','BNB','BNB'],['solana','SOL','ソラナ'],['usd-coin','USDC','USD Coin'],['staked-ether','STETH','Lido Staked ETH'],['dogecoin','DOGE','ドージコイン'],['tron','TRX','トロン'],['the-open-network','TON','Toncoin'],['cardano','ADA','カルダノ'],['wrapped-bitcoin','WBTC','Wrapped Bitcoin'],['avalanche-2','AVAX','Avalanche'],['shiba-inu','SHIB','Shiba Inu'],['chainlink','LINK','Chainlink'],['bitcoin-cash','BCH','Bitcoin Cash'],['polkadot','DOT','Polkadot'],['uniswap','UNI','Uniswap'],['litecoin','LTC','Litecoin']];
const colors=['#547b61','#4b87b8','#c18b50','#a16e9a','#6e9a91'];
let chosen=['bitcoin','ethereum','ripple','solana'],period='30',data=[];
const periods=[['1日','1'],['7日','7'],['1か月','30'],['3か月','90'],['6か月','180'],['1年','365'],['2年','730'],['5年','1825'],['最大','max']];
document.getElementById('periods').innerHTML=periods.map(p=>'<button data-days="'+p[1]+'" class="'+(p[1]===period?'active':'')+'">'+p[0]+'</button>').join('');
document.getElementById('periods').onclick=e=>{if(!e.target.dataset.days)return;period=e.target.dataset.days;document.querySelectorAll('#periods button').forEach(b=>b.classList.toggle('active',b.dataset.days===period));draw()};
document.getElementById('refresh').onclick=load;
function yen(n){return n==null?'—':'¥'+Number(n).toLocaleString('ja-JP',{maximumFractionDigits:n<100?4:0})}
async function load(){
document.getElementById('priceStatus').textContent='価格取得中…';
try{
const ids=assets.map(a=>a[0]).join(',');
const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=jpy&ids='+ids+'&price_change_percentage=24h');
if(!r.ok)throw Error();
data=await r.json();
document.getElementById('coins').innerHTML=assets.map(a=>{const d=data.find(x=>x.id===a[0]);return '<div class="coin"><label><input type="checkbox" data-id="'+a[0]+'" '+(chosen.includes(a[0])?'checked':'')+'> '+a[1]+' <small>'+a[2]+'</small></label><div class="price">'+yen(d?.current_price)+'</div><small>'+(d?.price_change_percentage_24h==null?'24h変動 —':d.price_change_percentage_24h.toFixed(2)+'%（24h）')+'</small></div>'}).join('');
document.querySelectorAll('#coins input').forEach(c=>c.onchange=()=>{if(c.checked){if(chosen.length>=5){c.checked=false;alert('最大5銘柄までです');return}chosen.push(c.dataset.id)}else chosen=chosen.filter(id=>id!==c.dataset.id);draw()});
document.getElementById('priceStatus').textContent='最終取得：'+new Date().toLocaleString('ja-JP');
draw();
}catch(e){document.getElementById('priceStatus').textContent='価格を取得できません。少し待ってから再更新してください。';document.getElementById('status').textContent='API制限または通信エラーです。'}
}
async function draw(){
const c=document.getElementById('chart'),ctx=c.getContext('2d'),w=c.clientWidth,h=260,dpr=devicePixelRatio||1;
c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
const pad=38,cw=w-pad-8,ch=h-35;ctx.strokeStyle='#e6e5dc';
for(let i=0;i<5;i++){const y=12+i*ch/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-8,y);ctx.stroke()}
document.getElementById('status').textContent='履歴データを取得中…';
let ss=[];
for(let i=0;i<chosen.length;i++){
const a=assets.find(x=>x[0]===chosen[i]);if(!a)continue;
try{const r=await fetch('https://api.coingecko.com/api/v3/coins/'+a[0]+'/market_chart?vs_currency=jpy&days='+period);if(!r.ok)continue;const j=await r.json();if(j.prices?.length>1)ss.push({name:a[1],pts:j.prices.map(p=>({t:p[0],v:p[1]})),color:colors[i%colors.length]})}catch(e){}
}
if(!ss.length){document.getElementById('status').textContent='履歴を取得できません。API制限の可能性があります。';return}
ss=ss.map(s=>({...s,pts:s.pts.map(p=>({...p,v:p.v/s.pts[0].v*100}))}));
const vals=ss.flatMap(s=>s.pts.map(p=>p.v)),min=Math.min(...vals,100),max=Math.max(...vals,100);
const start=Math.min(...ss.map(s=>s.pts[0].t)),end=Math.max(...ss.map(s=>s.pts[s.pts.length-1].t));
const x=t=>pad+(t-start)/(end-start||1)*cw,y=v=>12+(max-v)/(max-min||1)*ch;
ss.forEach(s=>{ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=2;s.pts.forEach((p,i)=>i?ctx.lineTo(x(p.t),y(p.v)):ctx.moveTo(x(p.t),y(p.v)));ctx.stroke()});
document.getElementById('legend').innerHTML=ss.map(s=>'<span style="color:'+s.color+';margin-right:12px">'+s.name+'</span>').join('');
document.getElementById('status').textContent='期間の開始価格を100として表示。取得できた銘柄のみ表示しています。';
}
load();
</script>
</body>
</html>
